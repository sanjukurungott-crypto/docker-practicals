services:
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8081:8081"
    networks:
      - micro-net

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
    depends_on:
      - product-service
    networks:
      - micro-net

networks:
  micro-net:
    name: int363-micro-net
    driver: bridge
